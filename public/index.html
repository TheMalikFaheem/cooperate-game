<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuessME — Anonymous Reviews</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="auth-container">
    <!-- Left Branding Panel -->
    <div class="auth-brand">
        <div class="brand-logo">💬</div>
        <h1>GuessME</h1>
        <p>The anonymous review game for your group. Create a room, share the link, and watch the tea get spilled — anonymously.</p>
        <div class="brand-features">
            <div class="feature-item"><span>⚡</span> Real-time messages</div>
            <div class="feature-item"><span>🔒</span> 100% anonymous for participants</div>
            <div class="feature-item"><span>🎯</span> Multiple rooms per account</div>
        </div>
    </div>

    <!-- Right Auth Panel -->
    <div class="auth-panel">
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login">Login</button>
            <button class="auth-tab" id="tab-register">Sign Up</button>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn-dark full-width mt-1" id="login-btn">Login →</button>
            <p class="auth-switch">No account? <a href="#" id="go-register">Sign up free</a></p>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="auth-form hidden">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="reg-name" placeholder="John Doe" autocomplete="name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password <span style="font-weight:400; color: var(--text-muted)">(min 6 chars)</span></label>
                <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password">
            </div>
            <button class="btn-dark full-width mt-1" id="register-btn">Create Account →</button>
            <p class="auth-switch">Have an account? <a href="#" id="go-login">Login</a></p>
        </div>
    </div>
</div>

<div id="toast-container"></div>
<script src="auth.js"></script>
</body>
</html>
